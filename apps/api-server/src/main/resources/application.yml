spring:
  application:
    name: altneb-api-server
  profiles:
    default: local
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
