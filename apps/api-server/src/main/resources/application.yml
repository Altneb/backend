spring:
  application:
    name: altneb-api-server
  profiles:
    default: local
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/altneb}
    username: ${DB_USERNAME:altneb}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

altneb:
  security:
    jwt:
      issuer: ${JWT_ISSUER:altneb-api}
      audience: ${JWT_AUDIENCE:altneb-web}
      secret-base64: ${JWT_SECRET_BASE64:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
