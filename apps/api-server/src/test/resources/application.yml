spring:
  application:
    name: altneb-api-server
  profiles:
    default: local
  modulith:
    detection-strategy: explicitly-annotated
    runtime:
      verification-enabled: true
  datasource:
    url: jdbc:h2:mem:altneb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

altneb:
  security:
    jwt:
      issuer: altneb-api-test
      audience: altneb-web-test
      secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    cors:
      allowed-origins:
        - http://localhost:3000
    refresh-cookie:
      secure: false
